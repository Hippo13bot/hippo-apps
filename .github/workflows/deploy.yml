
name: Build and Deploy HIPPO APPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04

    steps:
      - name: Download source code
        uses: actions/checkout@v5

      - name: Check website files
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing from the repository root."
            exit 1
          fi
          echo "Website files found."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish website
        uses: actions/deploy-pages@v4
